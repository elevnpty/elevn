<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELEVN · Crea tu jugador</title>
<meta name="description" content="Crea tu jugador, suma tus partidos y logros, y gánate tu media. La plataforma del fútbol amateur en Panamá.">
<meta property="og:title" content="ELEVN · Crea tu jugador. Gánate tu media.">
<meta property="og:description" content="Todos arrancan en 50. Tu trayectoria y lo que haces en la cancha te suben.">
<meta name="theme-color" content="#0A1224">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230A1224'/%3E%3Ctext x='50' y='72' font-size='62' font-family='Arial Black,Arial' font-weight='900' text-anchor='middle' fill='%23F5C542'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1224;--bg2:#0F1A33;--panel:#121F3B;--panel2:#172748;--line:#22345C;--text:#EEF3FF;--muted:#8E9FC4;--lime:#C6FF3D;--cyan:#2FD3FF;--gold:#FFC83D;--red:#FF5A6E;--green:#3DFFA2;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{background:radial-gradient(1200px 500px at 80% -100px,rgba(47,211,255,.12),transparent 60%),radial-gradient(900px 400px at -10% 0,rgba(255,200,61,.07),transparent 60%),var(--bg);min-height:100vh}
body.liga{background:radial-gradient(1200px 500px at 80% -100px,rgba(198,255,61,.12),transparent 60%),var(--bg)}
a{color:var(--cyan);text-decoration:none}
h1,h2,h3,.disp{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.5px;font-weight:400;margin:0}
h2{font-size:32px}h3{font-size:22px}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;background:rgba(10,18,36,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding:12px 0 10px}
.brand{font-family:Anton,Impact,sans-serif;font-size:32px;letter-spacing:3px;color:var(--text);line-height:1}
.brand i{font-style:normal;color:var(--gold)}
.sw{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.sw a{padding:7px 14px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted);letter-spacing:.5px;white-space:nowrap}
.sw a.on.red{background:var(--gold);color:#0A1224}.sw a.on.lg{background:var(--lime);color:#0A1224}
.sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.badge.open{color:#0A1224;background:var(--lime);border-color:var(--lime)}
.badge.closed{color:var(--red);border-color:rgba(255,90,110,.4)}
.badge.gold{color:#0A1224;background:var(--gold);border-color:var(--gold)}
.badge.cyan{color:#0A1224;background:var(--cyan);border-color:var(--cyan)}
.badge.ghost{background:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.open .dot{animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.3}}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{padding:8px 14px;border-radius:10px;color:var(--muted);font-weight:600;white-space:nowrap;font-size:14px}
nav a:hover{color:var(--text);background:var(--panel)}
nav a.on{color:#0A1224;background:var(--text)}
nav a.cta{color:#0A1224;background:var(--gold)}
body.liga nav a.cta{background:var(--lime)}
select,input,textarea{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--cyan)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--lime)}
label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;font-size:14px;border-radius:11px;padding:10px 16px;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line);white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.lime{background:var(--lime);color:#0A1224;border-color:var(--lime)}
.btn.cyan{background:var(--cyan);color:#0A1224;border-color:var(--cyan)}
.btn.gold{background:var(--gold);color:#0A1224;border-color:var(--gold)}
.btn.red{background:transparent;color:var(--red);border-color:rgba(255,90,110,.45)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}
main{padding:22px 0 60px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:38px 30px;background:linear-gradient(120deg,#13254A 0%,#0F1A33 55%,#2A2310 100%);border:1px solid var(--line)}
body.liga .hero{background:linear-gradient(120deg,#13254A 0%,#0F1A33 55%,#0E2A3A 100%)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.025) 60px 120px)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(44px,7vw,78px);line-height:.92}
.hero h1 em{font-style:normal;color:var(--gold)}
body.liga .hero h1 em{color:var(--lime)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.stat{background:rgba(10,18,36,.55);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:120px}
.stat b{display:block;font-family:'Bebas Neue';font-size:32px;line-height:1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:10px 8px;border-bottom:1px solid rgba(34,52,92,.55);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(47,211,255,.05)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.val{font-weight:800;color:var(--lime);white-space:nowrap}
.tw{overflow-x:auto}
.pos{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 6px;border-radius:6px;letter-spacing:.4px}
.pos.POR{background:#FFC83D22;color:var(--gold)}.pos.DFC,.pos.LAT{background:#2FD3FF22;color:var(--cyan)}.pos.MC,.pos.MCO{background:#3DFFA222;color:var(--green)}.pos.EXT,.pos.DC{background:#FF5A6E22;color:#FF8797}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--panel2);display:inline-grid;place-items:center;font-weight:800;font-size:13px;flex:none;border:2px solid var(--line)}
.ovrchip{display:inline-grid;place-items:center;min-width:38px;height:30px;border-radius:8px;font-family:Anton;font-size:18px;padding:0 6px}
.pname{font-weight:700;color:var(--text)}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}.empty .ic{font-size:40px;margin-bottom:8px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.clubcard{display:block;color:var(--text);position:relative;overflow:hidden}.clubcard .stripe{position:absolute;left:0;top:0;bottom:0;width:5px}.clubcard:hover{border-color:var(--cyan)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:rgba(10,18,36,.45);border-radius:10px;padding:8px 10px}.kpi b{display:block;font-size:15px}.kpi span{font-size:11px;color:var(--muted)}
.statbox{background:rgba(10,18,36,.5);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.statbox b{display:block;font-family:'Bebas Neue';font-size:38px;line-height:1}.statbox span{font-size:12px;color:var(--muted);font-weight:600}
.banner{border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;border:1px solid var(--line)}
.banner.open{background:linear-gradient(90deg,rgba(198,255,61,.18),rgba(198,255,61,.03));border-color:rgba(198,255,61,.4)}
.banner.closed{background:linear-gradient(90deg,rgba(255,90,110,.14),rgba(255,90,110,.02));border-color:rgba(255,90,110,.35)}
.banner .ic{font-size:30px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:700;cursor:pointer;font-size:13.5px}
.tab.on{background:var(--cyan);color:#0A1224;border-color:var(--cyan)}
.offer{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(10,18,36,.4);margin-bottom:10px}
.arrow{color:var(--muted);font-weight:800}
.rule{display:flex;gap:14px}.rule .n{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--panel2);border:1px solid var(--line)}.rule p{margin:4px 0 0;color:#C9D4EE;line-height:1.5}
.spons{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.spon{height:74px;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-weight:700;text-align:center;padding:8px}
.spon.real{border-style:solid;color:var(--text);font-family:'Bebas Neue';font-size:24px;background:var(--panel)}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.fld{margin-bottom:12px}
.note{background:rgba(47,211,255,.08);border:1px solid rgba(47,211,255,.3);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45}
.note.warn{background:rgba(255,200,61,.08);border-color:rgba(255,200,61,.35)}.note.bad{background:rgba(255,90,110,.08);border-color:rgba(255,90,110,.35)}.note.ok{background:rgba(61,255,162,.08);border-color:rgba(61,255,162,.35)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,7,16,.75);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.modal.hidden{display:none}
.mbox{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.5)}.mbox.wide{max-width:900px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:var(--text);color:#0A1224;padding:11px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:14px}.t.bad{background:var(--red);color:#fff}
.jor{font-family:'Bebas Neue';font-size:20px;color:var(--cyan);margin:14px 0 6px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(10,18,36,.4);border:1px solid var(--line);margin-bottom:8px}
.match .r{font-family:'Bebas Neue';font-size:24px;min-width:70px;text-align:center}
.mini-in{width:56px;text-align:center;padding:6px}
.foot{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:12.5px}
.chart{width:100%;height:180px}.medal{font-size:16px}
/* Cartas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;position:relative;background:var(--cbg);color:var(--cfg);border:3px solid var(--cbd);border-radius:22px;padding:14px 14px 16px;transition:transform .15s;overflow:hidden}
.pcard:hover{transform:translateY(-4px)}
.pcard:before{content:"";position:absolute;inset:6px;border:1px solid var(--cbd);border-radius:16px;opacity:.35;pointer-events:none}
.pcard:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:16px solid var(--cbd);opacity:.14}
.pcard .tp{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;position:relative;z-index:1}
.pcard .lc{display:flex;flex-direction:column;align-items:center;padding:4px 0 0 4px;min-width:46px}
.pcard .ovr{font-family:Anton;font-size:44px;line-height:.9}
.pcard .ps{font-family:'Space Grotesk';font-weight:700;font-size:14px;letter-spacing:2px;margin-top:2px}
.pcard .ln{width:28px;height:1px;background:var(--cfg);opacity:.4;margin:7px 0}
.pcard .ph{width:100%;aspect-ratio:1;max-width:120px;justify-self:end;border-radius:50%;object-fit:cover;border:3px solid var(--cbd);background:rgba(0,0,0,.1);display:grid;place-items:center;font-family:Anton;font-size:32px}
.pcard .nm{position:relative;z-index:1;font-family:Anton;text-align:center;margin-top:8px;padding:7px 0 6px;letter-spacing:.5px;line-height:1.05;text-transform:uppercase;border-top:1px solid color-mix(in srgb,var(--cfg) 35%,transparent);border-bottom:1px solid color-mix(in srgb,var(--cfg) 35%,transparent)}
.pcard .at{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1px 1fr;gap:0 10px;font-family:'Space Grotesk';font-size:13.5px;margin-top:8px}
.pcard .at .col{display:grid;grid-template-columns:auto auto;column-gap:7px;row-gap:3px;justify-content:center;align-content:start}.pcard .at .sep{background:var(--cfg);opacity:.35}
.pcard .at b{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}.pcard .at span{text-align:left}
.pcard.big{max-width:300px;padding:20px 20px 22px}.pcard.big .ovr{font-size:68px}.pcard.big .ps{font-size:18px}.pcard.big .lc{min-width:66px}.pcard.big .ph{max-width:180px}.pcard.big .at{font-size:17px}.pcard.big .ln{width:40px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tier{border-radius:12px;padding:10px;text-align:center;border:2px solid}
.tier b{display:block;font-family:Anton;font-size:24px}
.lgph{width:100%;height:150px;object-fit:cover;border-radius:12px;cursor:zoom-in;border:1px solid var(--line)}
@media(max-width:640px){.hero{padding:28px 20px}.hide-m{display:none}.brand{font-size:26px}.sw a{padding:6px 9px;font-size:12px}.cards{grid-template-columns:repeat(2,1fr);gap:10px}.pcard .ph{width:64px;height:64px}.pcard .ovr{font-size:36px}}
#ovl{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
#ovl .ovb{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(460px,100%);max-height:90vh;overflow:auto}
#ovl .ovx{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--text);font-size:18px;cursor:pointer}
#ovl textarea,#ovl input[type=email],#ovl input[type=password]{background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}
@media(max-width:640px){
body{font-size:14px}
.hero{padding:20px 16px!important;border-radius:18px}.hero h1{font-size:34px!important}.hero p{font-size:14px!important;margin-top:8px!important}
.hero .btn{font-size:13px;padding:8px 12px}.hero .row{margin-top:14px!important;gap:8px}
h1{font-size:34px}h2{font-size:23px}h3{font-size:19px}
.stats{display:grid!important;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.stat{min-width:0;padding:8px 6px;border-radius:10px;text-align:center}.stat b{font-size:22px}.stat span{font-size:10px;line-height:1.15;display:block}
#nav a{font-size:13px;padding:6px 10px}
.cards{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:7px!important}
.cards .pcard{padding:6px 5px 7px;border-width:2px;border-radius:12px}
.cards .pcard .tp{gap:3px}.cards .pcard .lc{min-width:0;padding:2px 0 0 1px}
.cards .pcard .ovr{font-size:22px}.cards .pcard .ps{font-size:8.5px;letter-spacing:1px;margin-top:1px}
.cards .pcard .ln{width:14px;margin:3px 0}.cards .pcard .lc img,.cards .pcard .lc svg{width:15px!important;height:17px!important}
.cards .pcard .ph{width:100%;height:auto;max-width:52px;border-width:2px;font-size:14px}
.cards .pcard .nm{font-size:9.5px!important;margin-top:4px;padding:3px 0;letter-spacing:0;line-height:1.15;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;align-content:center}
.cards .pcard .at{font-size:8.5px;gap:0 3px;margin-top:4px}.cards .pcard .at .col{column-gap:3px;row-gap:1px}
}
.apr{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:start;margin-top:10px}.apr-c .pcard{width:100%}
.apr-i{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.apr-i span{color:var(--muted)}.apr-i b{text-align:right;min-width:0;overflow-wrap:anywhere}
@media(max-width:560px){.apr{grid-template-columns:1fr}.apr-c{max-width:200px;margin:0 auto}}
body.cover header,body.cover .foot,body.cover #visBtn{display:none!important}
body.cover main,body.cover #app{padding:0!important;max-width:none!important}
.portada{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 18px;overflow:hidden;background:radial-gradient(ellipse 80% 55% at 50% 38%,rgba(255,200,61,.10),transparent 70%),linear-gradient(180deg,#03060d 0%,#071024 55%,#03060d 100%);isolation:isolate}
.pt-field{position:absolute;left:-40%;right:-40%;bottom:-6%;height:72%;perspective:520px;pointer-events:none;z-index:-1;-webkit-mask-image:linear-gradient(to top,#000 5%,rgba(0,0,0,.6) 35%,transparent 62%);mask-image:linear-gradient(to top,#000 5%,rgba(0,0,0,.6) 35%,transparent 62%)}
.pt-lines{position:absolute;inset:0;transform:rotateX(62deg);transform-origin:50% 100%;background:radial-gradient(circle at 50% 22%,transparent 12.2%,rgba(235,245,255,.75) 12.5%,transparent 13%),radial-gradient(circle at 50% 22%,rgba(255,200,61,.9) .5%,transparent .9%),linear-gradient(0deg,transparent calc(22% - 2px),rgba(235,245,255,.7) calc(22% - 2px) 22%,transparent 22%),linear-gradient(90deg,transparent 33%,rgba(235,245,255,.55) 33% 33.3%,transparent 33.3% 66.7%,rgba(235,245,255,.55) 66.7% 67%,transparent 67%),repeating-linear-gradient(0deg,rgba(40,150,80,.30) 0 60px,rgba(20,100,55,.30) 60px 120px);animation:ptRun 6s linear infinite}
@keyframes ptRun{to{background-position:0 0,0 0,0 0,0 0,0 120px}}
.pt-beam{position:absolute;top:-20%;width:60%;height:120%;pointer-events:none;z-index:-1;opacity:.55;filter:blur(2px)}
.pt-beam.l{left:-12%;background:conic-gradient(from 155deg at 0% 0%,transparent 0deg,rgba(150,200,255,.14) 10deg,transparent 22deg)}
.pt-beam.r{right:-12%;background:conic-gradient(from 183deg at 100% 0%,transparent 0deg,rgba(150,200,255,.14) 12deg,transparent 24deg)}
.pt-scan{position:absolute;inset:0;pointer-events:none;z-index:-1;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
.pt-hud{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;font-size:11px;letter-spacing:4px;color:rgba(200,215,240,.55);font-weight:600}
.pt-hud.top{top:22px}.pt-hud.bot{bottom:22px}.pt-hud b{color:var(--gold);font-weight:800}
.pt-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}

const eqLink=(l,k,sz=22,der)=>{const c=k&&!String(k).startsWith('n:')&&clubById(k);const n=`<b>${esc(eqNombre(l,k))}</b>`;const cr=eqCrest(k,sz);const inner=der?n+cr:cr+n;return c?`<a href="#club-${esc(c.id)}" class="row res-eq ${der?'der':''}" style="gap:7px">${inner}</a>`:`<span class="row res-eq ${der?'der':''}" style="gap:7px">${inner}</span>`};
function tablaDePartidos(l,ps){const base=(l.tabla||[]).map(t=>({cid:t.cid||null,nombre:t.nombre||'',g:0,e:0,p:0,gf:0,gc:0}));const by={};base.forEach(t=>by[eqKey(t)]=t);
  const get=k=>{if(!by[k]){const t=String(k).startsWith('n:')?{cid:null,nombre:String(k).slice(2)}:{cid:k,nombre:clubById(k)?.nombre||''};by[k]={...t,g:0,e:0,p:0,gf:0,gc:0};base.push(by[k])}return by[k]};
  for(const m of ps){const a=get(m.l),b=get(m.v),x=num(m.gl),y=num(m.gv);a.gf+=x;a.gc+=y;b.gf+=y;b.gc+=x;if(x>y){a.g++;b.p++}else if(x<y){b.g++;a.p++}else{a.e++;b.e++}}
  return base}
function resultadosHTML(l){const ps=(l.partidos||[]).slice();if(!ps.length)return '';const js=[...new Set(ps.map(m=>num(m.j)))].sort((a,b)=>b-a);
  const ed=puedeEditarLiga(l);return js.map(j=>`<div class="res-j"><div class="res-jt">Jornada ${j}</div>${ps.map((m,i)=>[m,i]).filter(([m])=>num(m.j)===j).map(([m,i])=>`<div class="res-row">${eqLink(l,m.l,22)}<button type="button" class="res-sc click" data-act="verPart" data-id="${esc(l.id)}" data-i="${i}" title="${ed?'Editar goles, asistencias, MVP…':'Ver detalle del partido'}">${num(m.gl)} – ${num(m.gv)}</button>${eqLink(l,m.v,22,true)}</div>${evResumen(l,m)}`).join('')}</div>`).join('')}
const evNom=e=>{const p=e.pid&&playerById(e.pid);return p?(p.apodo||p.nombre.split(' ').slice(0,2).join(' ')):(e.nombre||'?')};
function evResumen(l,m){const ev=m.ev||[];if(!ev.length)return '';const lado=k=>{const xs=ev.filter(e=>e.k===k);const parts=[];xs.filter(e=>num(e.g)).forEach(e=>parts.push(`⚽ ${esc(evNom(e))}${num(e.g)>1?' ×'+num(e.g):''}`));xs.filter(e=>num(e.a)).forEach(e=>parts.push(`<span class="muted">🅰️ ${esc(evNom(e))}${num(e.a)>1?' ×'+num(e.a):''}</span>`));xs.filter(e=>num(e.at)||e.vi).forEach(e=>parts.push(`<span class="muted">🧤 ${esc(evNom(e))}${num(e.at)?' '+num(e.at)+' at.':''}${e.vi?' · valla 0':''}</span>`));return parts.join('<br>')};const mv=ev.find(e=>e.mvp);

function evRow(k,e,conc,pid){const p=pid&&playerById(pid);const on=!!e;e=e||{};const id='r'+Math.random().toString(36).slice(2,8);
  return `<div class="evrow" data-k="${esc(k)}" data-pid="${esc(pid||'')}"><div class="ev-n">${p?`<div class="row" style="gap:8px"><b>${esc(p.nombre)}</b> <span class="pos ${esc(p.pos)}" style="font-size:10px">${esc(p.pos)}</span></div>`:`<input class="e-nom" placeholder="Nombre del jugador" maxlength="40" value="${esc(e.nombre||'')}">`}</div>
  <label class="ev-f"><span>Goles</span><input class="e-g" type="number" min="0" max="20" value="${num(e.g)||''}"></label><label class="ev-f"><span>Asist.</span><input class="e-a" type="number" min="0" max="20" value="${num(e.a)||''}"></label><label class="ev-f"><span>Atajadas</span><input class="e-at" type="number" min="0" max="40" value="${num(e.at)||''}"></label>
  <label class="ev-c"><input type="radio" name="mvp" class="e-mvp" value="${id}" ${e.mvp?'checked':''}> MVP</label><label class="ev-c ${conc?'off':''}"><input type="checkbox" class="e-vi" ${e.vi&&!conc?'checked':''} ${conc?'disabled':''}> Valla 0</label></div>`}
function evLado(l,m,k,conc){const ev=(m.ev||[]).filter(e=>e.k===k);const cid=!String(k).startsWith('n:')&&k;const sq=cid?squad(cid).sort((a,b)=>String(a.nombre).localeCompare(b.nombre)):[];const fuera=ev.filter(e=>!e.pid||!sq.some(p=>p.id===e.pid));

function partidosDeClub(cid){const out=[];for(const l of S.ligas.filter(x=>x.estado==='aprobado'))for(const m of (l.partidos||[])){if(m.l!==cid&&m.v!==cid)continue;const loc=m.l===cid;const gf=num(loc?m.gl:m.gv),gc=num(loc?m.gv:m.gl);out.push({l,m,riv:loc?m.v:m.l,loc,gf,gc,r:gf>gc?'G':gf<gc?'P':'E'})}return out.sort((a,b)=>num(b.m.j)-num(a.m.j))}
function partidosClubHTML(cid){const ps=partidosDeClub(cid);if(!ps.length)return '';const g=ps.filter(x=>x.r==='G').length,e=ps.filter(x=>x.r==='E').length,p=ps.filter(x=>x.r==='P').length,gf=ps.reduce((a,x)=>a+x.gf,0),gc=ps.reduce((a,x)=>a+x.gc,0);
  return `<div class="card sec"><div class="sec-h"><h3>📅 Partidos en torneos</h3><span class="tiny muted">${ps.length} PJ · ${g}G ${e}E ${p}P · ${gf}-${gc}</span></div>${ps.map(x=>`<div class="res-row club"><span class="res-r ${x.r}">${x.r}</span><div style="min-width:0;flex:1"><div class="tiny muted"><a href="#lg-${esc(x.l.id)}">${esc(x.l.nombre)}</a> · Jornada ${num(x.m.j)} · ${x.loc?'Local':'Visitante'}</div><div class="row" style="gap:8px;margin-top:3px"><span class="muted small">vs</span> ${eqLink(x.l,x.riv,20)}</div></div><button type="button" class="res-sc click" data-act="verPart" data-id="${esc(x.l.id)}" data-i="${(x.l.partidos||[]).indexOf(x.m)}">${x.gf} – ${x.gc}</button></div>`).join('')}</div>`}
function resRow(l,m={}){const eqs=(l.tabla||[]).map(t=>[eqKey(t),t.cid?(clubById(t.cid)?.nombre||t.nombre):t.nombre]);const sel=(c,v)=>`<select class="${c}"><option value="">Equipo…</option>${eqs.map(([k,n])=>`<option value="${esc(k)}" ${v===k?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
  return `<div class="mrow" data-i="${m._i!=null?m._i:''}"><label class="tiny muted" style="grid-area:jl;align-self:center">Jornada</label><input class="m-j" style="grid-area:j" type="number" min="1" max="60" value="${num(m.j)||''}" placeholder="J"><button type="button" class="btn sm red" style="grid-area:x" data-act="delRowM">✕</button><div style="grid-area:l">${sel('m-l',m.l)}</div><input class="m-gl" style="grid-area:gl" type="number" min="0" max="50" placeholder="Goles" value="${m.gl!=null?num(m.gl):''}"><div style="grid-area:v">${sel('m-v',m.v)}</div><input class="m-gv" style="grid-area:gv" type="number" min="0" max="50" placeholder="Goles" value="${m.gv!=null?num(m.gv):''}"></div>`}
function ligaCrest(l,sz=44){return okImg(l.logo)?`<img src="${l.logo}" alt="" style="width:${sz}px;height:${sz}px;object-fit:contain;flex:none">`:`<div class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.45)}px;flex:none">🏆</div>`}
function tablaOrden(l){return (l.tabla||[]).map(t=>{const pj=num(t.g)+num(t.e)+num(t.p);return {...t,pj,pts:num(t.g)*3+num(t.e),dg:num(t.gf)-num(t.gc)}}).sort((a,b)=>b.pts-a.pts||b.dg-a.dg||num(b.gf)-num(a.gf))}
const normTxt=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const ligaKeys=l=>{const n=normTxt(l.nombre);const k=[n];if(n.endsWith('s'))k.push(n.replace(/s\b/g,''));return k.filter(x=>x.length>=4)};
function autoJugLiga(l,pid){const ks=ligaKeys(l);const o={g:0,a:0,pj:0,vi:0,at:0,mvp:0};if(!ks.length)return o;for(const a of playerMatches(pid,a=>a.estado==='aprobado')){const d=normTxt(a.detalle);if(!ks.some(k=>d.includes(k)||d.includes(k.replace(/s\b/g,''))))continue;o.g+=num(a.g);o.a+=num(a.a);o.at+=num(a.at);if(a.vi)o.vi++;if(a.mvp)o.mvp++;o.pj++}return o}
const jugDePartidos=l=>{const by={};for(const m of (l.partidos||[]))for(const e of (m.ev||[])){const key=e.pid||('n:'+String(e.nombre||'').trim().toLowerCase());if(key==='n:')continue;const o=by[key]||(by[key]={pid:e.pid||null,nombre:e.pid?(playerById(e.pid)?.nombre||e.nombre||''):e.nombre,equipo:eqNombre(l,e.k),pj:0,g:0,a:0,vi:0,at:0,mvp:0});o.pj++;o.g+=num(e.g);o.a+=num(e.a);o.at+=num(e.at);if(e.vi)o.vi++;if(e.mvp)o.mvp++}return Object.values(by)};
const ligaJug=l=>{const man=(l.jug||[]).map(x=>({...x,pj:num(x.pj),g:num(x.g),a:num(x.a),vi:num(x.vi),at:num(x.at),mvp:num(x.mvp)}));for(const j of jugDePartidos(l)){const m=man.find(x=>(j.pid&&x.pid===j.pid)||(!j.pid&&!x.pid&&String(x.nombre||'').trim().toLowerCase()===String(j.nombre||'').trim().toLowerCase()));if(m){for(const k of ['pj','g','a','vi','at','mvp'])m[k]=Math.max(m[k],j[k])}else man.push(j)}return man};
/* Partidos de torneos para un jugador: si su equipo jugó, siempre cuenta como partido jugado. El detalle del partido solo agrega lo que hizo (goles, asistencias, atajadas, valla, MVP) */
function partidosTorneoJug(l,p){const out=[];if(!p.clubId)return out;(l.partidos||[]).forEach((m,i)=>{if(m.l!==p.clubId&&m.v!==p.clubId)return;const k=p.clubId;const loc=m.l===k;const gf=num(loc?m.gl:m.gv),gc=num(loc?m.gv:m.gl);const e=(m.ev||[]).find(e=>e.k===k&&e.pid===p.id);const porLado=(m.ev||[]).some(e=>e.k===k&&e.vi);const s=e?{g:num(e.g),a:num(e.a),at:num(e.at),vi:!!e.vi,mvp:!!e.mvp,gc}:{g:0,a:0,at:0,vi:gc===0&&p.pos==='POR'&&!porLado,mvp:false,gc};out.push({m,i,s,riv:loc?m.v:m.l,gf,gc})});return out}
function extraLigaEventos(p){const ev=[];for(const l of S.ligas){if(l.estado!=='aprobado')continue;const base=num(l.creado)||0;
  const pm=partidosTorneoJug(l,p);const mt={pj:0,g:0,a:0,at:0,vi:0,mvp:0};
  for(const x of pm){mt.pj++;mt.g+=x.s.g;mt.a+=x.s.a;mt.at+=x.s.at;if(x.s.vi)mt.vi++;if(x.s.mvp)mt.mvp++;ev.push({k:'a',tipo:'liga',ts:base+num(x.m.j)*1000+x.i,l:'🏆',d:`${l.nombre} · J${num(x.m.j)} · vs ${eqNombre(l,x.riv)} ${x.gf}-${x.gc}`,s:x.s})}
  const e=(l.jug||[]).find(x=>x.pid===p.id);if(!e)continue;const au=autoJugLiga(l,p.id);const X=k=>Math.max(0,num(e[k])-au[k]-mt[k]);const pj=X('pj'),g=X('g'),a=X('a'),vi=X('vi'),at=X('at'),mv=X('mvp');const n=Math.max(pj,(g||a||vi||at||mv)?1:0);const ts=num(l.actualizado)||base;const sp=(t,i)=>Math.floor(t/n)+(i<t%n?1:0);
  for(let i=0;i<n;i++)ev.push({k:'a',tipo:'liga',ts:ts+i,l:'🏆',d:l.nombre+' (estadísticas del torneo)',s:{g:sp(g,i),a:sp(a,i),at:sp(at,i),vi:i<vi,mvp:i<mv},noPj:i>=pj})}return ev}
function statsAutoLiga(l){const out={};for(const p of S.players){if(p.estado!=='aprobado')continue;const o=autoJugLiga(l,p.id);if(o.pj)out[p.id]=o}return out}
function rankLista(l,k){const f0={goleadores:'g',asistencias:'a'}[k]||k;const man=(l[k]||[]).map(x=>({...x,n:num(x.n)}));ligaJug(l).forEach(j=>{const m=j.pid&&man.find(x=>x.pid===j.pid);if(m)m.n=Math.max(m.n,j[f0]);else man.push({pid:j.pid,nombre:j.nombre,equipo:j.equipo,n:j[f0]})});
  const auto=statsAutoLiga(l);Object.entries(auto).forEach(([pid,o])=>{const m=man.find(x=>x.pid===pid);if(m)m.n=Math.max(m.n,o[f0]);else if(o[f0]>0)man.push({pid,n:o[f0],auto:true})});
  return man.filter(x=>x.n>0).sort((a,b)=>b.n-a.n)}
function ligasDeJugador(p){return S.ligas.filter(l=>l.estado==='aprobado').map(l=>{const tb=tablaOrden(l);const i=p.clubId?tb.findIndex(t=>t.cid===p.clubId):-1;const g=rankLista(l,'goleadores').find(x=>x.pid===p.id);const a=rankLista(l,'asistencias').find(x=>x.pid===p.id);const au=statsAutoLiga(l)[p.id];if(i<0&&!g&&!a&&!au&&!ligaJug(l).some(x=>x.pid===p.id))return null;const jj=ligaJug(l).find(x=>x.pid===p.id);return {l,pos:i>=0?i+1:null,tot:tb.length,pts:i>=0?tb[i].pts:null,g:g?g.n:0,a:a?a.n:0,pj:Math.max(au?au.pj:0,jj?jj.pj:0,partidosTorneoJug(l,p).length)}}).filter(Boolean)}

const NIVELES=['Colegial / universitario','Amateur','Liga distrital / provincial','Academia o cantera de equipo','Juvenil de club profesional','Selección juvenil','Semiprofesional','Profesional','Selección mayor'];
const NIV_ALTO=['Semiprofesional','Profesional','Selección mayor'];
const NIV_DESC={'Liga distrital / provincial':'Cualquier liga fuera del colegio siendo menor de edad, si no es en la cantera de un club profesional','Academia o cantera de equipo':'Academia o fuerzas básicas de un club','Semiprofesional':'Desde Sub-19, competitivo alto. Necesita pruebas','Profesional':'Desde Sub-19, competitivo alto. Necesita pruebas','Selección mayor':'Desde Sub-19, competitivo alto. Necesita pruebas'};
/* Media de trayectoria por nivel según años en ese nivel: 1, 2, 3, 5, 8 y 10+ años (entre medio se interpola) */
const TRAY_Y=[1,2,3,5,8,10];
const TRAY_TAB={'Colegial / universitario':[53,54,54,55,55,56],'Amateur':[56,57,57,58,58,59],'Liga distrital / provincial':[64,65,66,68,69,69],'Academia o cantera de equipo':[64,65,66,68,69,69],'Juvenil de club profesional':[68,69,69,69,70,70],'Selección juvenil':[68,69,69,69,70,70],'Semiprofesional':[70,71,71,72,72,73],'Profesional':[73,74,74,75,75,76],'Selección mayor':[73,74,74,75,75,76]};
TRAY_TAB['Selección']=TRAY_TAB['Selección mayor'];
const TRAY_TOP=Object.fromEntries(Object.entries(TRAY_TAB).map(([k,v])=>[k,v[v.length-1]]));
const NIV=Object.fromEntries(Object.entries(TRAY_TOP).map(([k,v])=>[k,['am',v]]));
function trayMedia(nivel,n){const t=TRAY_TAB[nivel]||TRAY_TAB['Amateur'];if(n<=0)return MEDIA0;if(n<=TRAY_Y[0])return t[0];for(let i=1;i<TRAY_Y.length;i++)if(n<=TRAY_Y[i]){const a=TRAY_Y[i-1],b=TRAY_Y[i];return t[i-1]+(t[i]-t[i-1])*(n-a)/(b-a)}return t[t.length-1]}
function trayDe(hist){const Y=new Date().getFullYear();const yrs={};
  for(const x of (hist||[])){const d=num(x.desde);let a=x.actual?Y:(num(x.hasta)||Y);if(!d||d<1970||d>Y)continue;a=Math.min(Math.max(a,d),Y);const nv=x.nivelAdm||x.nivel;const n=TRAY_TAB[nv]?(nv==='Selección'?'Selección mayor':nv):'Amateur';yrs[n]=yrs[n]||new Set();for(let y=d;y<=a;y++)yrs[n].add(y)}
  /* Sin castigos: cuenta el nivel más alto al que llegaste, con los años que estuviste en él (más años, más puntos). Los niveles más bajos no restan. */
  const ns=Object.keys(yrs);if(!ns.length)return 0;const val=Math.max(...ns.map(n=>trayMedia(n,yrs[n].size)));
  return Math.max(0,Math.round((val-MEDIA0)*100)/100)}

/* ===== Modal ===== */
function openModal(html,wide){const m=$('#modal');m.innerHTML=`<div class="mbox ${wide?'wide':''}">${html}</div>`;m.classList.remove('hidden')}
function closeModal(){const m=$('#modal');m.classList.add('hidden');m.innerHTML='';render()}
function ask(title,text,okLabel='Confirmar'){return new Promise(res=>{openModal(`<h3>${title}</h3><p class="muted" style="line-height:1.5">${text}</p><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="mNo">Cancelar</button><button class="btn lime" id="mOk">${okLabel}</button></div>`);
  $('#mNo').onclick=()=>{$('#modal').classList.add('hidden');res(false)};$('#mOk').onclick=()=>{$('#modal').classList.add('hidden');res(true)}})}

/* ===== Traspasos ===== */
async function ejecutarTraspaso({p,de,a,monto,tipo,ofertaId}){const buyer=clubById(a),seller=clubById(de);monto=Math.round(num(monto));
  if(!buyer)throw 'Club comprador no encontrado';if(num(buyer.presupuesto)<monto)throw 'Presupuesto insuficiente para este traspaso';
  if(squad(a).length>=num(cfg().maxPlantilla))throw 'La plantilla del club comprador está llena';
  if(cfg().ventanaAbierta&&fichajesVentana(a)>=num(cfg().limiteFichajes))throw 'El club comprador ya llegó al límite de fichajes de esta ventana';
  if(seller&&tipo!=='prestamo'&&squad(de).length<=num(cfg().minPlantilla))throw 'El club vendedor quedaría por debajo del mínimo de jugadores';
  const bUpd={presupuesto:num(buyer.presupuesto)-monto};if(!cfg().ventanaAbierta&&buyer.reemplazoPendiente)bUpd.reemplazoPendiente=false;
  await db.doc('clubes/'+a).update(bUpd);if(seller)await db.doc('clubes/'+de).update({presupuesto:num(seller.presupuesto)+monto});
  await db.doc('jugadores/'+p.id).update({clubId:a,prestadoDe:tipo==='prestamo'?de:null});
  await db.collection('traspasos').add({playerId:p.id,nombre:p.nombre,de:de||null,a,monto,tipo,fecha:Date.now()});
  if(ofertaId)await db.doc('ofertas/'+ofertaId).update({estado:'aceptada',cerrado:Date.now()});
  for(const o of S.offers.filter(o=>o.playerId===p.id&&o.id!==ofertaId&&isOpen(o)))await db.doc('ofertas/'+o.id).update({estado:'cerrada',cerrado:Date.now()})}

/* ===== Acciones ===== */
const ACT={
  ofertar(d){const p=playerById(d.id);const a=actingId();if(!p||!a)return;const v=V(p);
    openModal(`<h3>💬 Ofertar por ${esc(p.nombre)}</h3><p class="small muted">${clubTag(a)} → ${clubTag(p.clubId)} · Precio: <b>${money(v.valor)}</b> · Tu presupuesto: <b>${money(clubById(a).presupuesto)}</b></p>
    <form data-form="oferta" data-id="${esc(p.id)}"><div class="f2"><div class="fld"><label>Tipo</label><select name="tipo"><option value="compra">💰 Compra</option><option value="prestamo">🔁 Préstamo</option></select></div><div class="fld"><label>Monto ($)</label><input name="monto" type="number" min="0" step="10000" value="${v.valor}" required></div></div>
    <div class="fld"><label>Mensaje para el club (opcional)</label><textarea name="mensaje" rows="2" maxlength="200"></textarea></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn cyan">Enviar oferta</button></div></form>`)},
  async clausula(d){const p=playerById(d.id);const a=actingId();if(!p||!a)return;const v=V(p);
    if(!await ask('⚡ Pagar cláusula',`Ofreces la cláusula completa de <b>${money(v.clausula)}</b> por <b>${esc(p.nombre)}</b>. ${esc(clubById(p.clubId)?.nombre||'Su club')} no puede bloquearlo: el traspaso se cierra en cuanto el jugador acepte, y el dinero se cobra en ese momento.`,'Pagar cláusula'))return;
    if(!windowOk(a))return toast('El mercado está cerrado',true);if(num(clubById(a).presupuesto)<v.clausula)return toast('No te alcanza el presupuesto',true);
    if(cfg().ventanaAbierta&&fichajesVentana(a)>=num(cfg().limiteFichajes))return toast('Ya hiciste los '+cfg().limiteFichajes+' fichajes de esta ventana',true);

function quitarFondo(cx,w,h){const im=cx.getImageData(0,0,w,h);const d=im.data;const px=(x,y)=>(y*w+x)*4;
  const corners=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([x,y])=>px(x,y));if(corners.some(i=>d[i+3]<20))return false;
  let r=0,g=0,b=0;corners.forEach(i=>{r+=d[i];g+=d[i+1];b+=d[i+2]});r/=4;g/=4;b/=4;
  if(corners.some(i=>Math.abs(d[i]-r)+Math.abs(d[i+1]-g)+Math.abs(d[i+2]-b)>60))return false;
  const tol=70,seen=new Uint8Array(w*h),q=[];const near=i=>Math.abs(d[i]-r)+Math.abs(d[i+1]-g)+Math.abs(d[i+2]-b)<=tol;
  for(let x=0;x<w;x++){q.push(x,0,x,h-1)}for(let y=0;y<h;y++){q.push(0,y,w-1,y)}
  let n=0;while(q.length){const y=q.pop(),x=q.pop();if(x<0||y<0||x>=w||y>=h)continue;const k=y*w+x;if(seen[k])continue;seen[k]=1;const i=k*4;if(!near(i))continue;d[i+3]=0;n++;q.push(x+1,y,x-1,y,x,y+1,x,y-1)}
  for(let k=0;k<w*h;k++){if(seen[k])continue;const x=k%w,y=(k/w)|0;let c=0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<w&&yy<h&&d[(yy*w+xx)*4+3]===0)c++}if(c)d[k*4+3]=Math.min(d[k*4+3],170)}
  if(n<w*h*0.03)return false;cx.putImageData(im,0,0);return true}

(()=>{let x0=null,y0=null;document.addEventListener('touchstart',e=>{if(!e.target.closest('#lgSwipe')||e.target.closest('.tw')){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0)ACT.lgNext();else ACT.lgPrev();window.scrollTo(0,0)}},{passive:true})})();
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ===== Conexión ===== */
async function loadNames(){if(!user||!user.profiles)return;const ids=[...new Set(S.clubs.map(c=>c.managerId).filter(Boolean))].filter(id=>!(id in S.names));if(!ids.length)return;try{const ps=await user.profiles(ids);ids.forEach(id=>S.names[id]=(ps&&ps[id]&&ps[id].name)||'');scheduleRender()}catch(e){}}
(async function init(){try{S.acting=localStorage.getItem('elevn_acting')||null}catch(_){}
  render();const timer=setTimeout(()=>{S.slow=true;scheduleRender()},10000);
  if(!window.claude||!window.claude.use){S.dbOk=false;clearTimeout(timer);render();return}
  try{db=await window.claude.use('db')}catch(e){db=null}try{user=await window.claude.use('user')}catch(e){user=null}
  if(!db){S.dbOk=false;clearTimeout(timer);render();return}S.dbOk=true;
  if(user){try{S.me=await user.id()}catch(e){}try{S.isAdmin=!!(await user.canEdit())}catch(e){}try{S.canWrite=await user.can('data.write')}catch(e){}}
  S.realAdmin=S.isAdmin;S.realMe=S.me;S.realCW=S.canWrite;try{if(S.realAdmin&&localStorage.getItem('elevn_vis')==='1'){S.vis=true;S.isAdmin=false;S.me=null;S.canWrite=false}}catch(e){}
  const need=10;const got=new Set();const mark=k=>{if(!got.has(k)){got.add(k);if(got.size>=need){S.loaded=true;clearTimeout(timer)}}S.calc=null;scheduleRender()};const fail=k=>e=>{console.error(k,e);mark(k)};const list=s=>s.docs.map(d=>({id:d.id,...d.data()}));
  db.doc('liga/config').onSnapshot(s=>{S.cfg=s.exists?s.data():null;mark('cfg')},fail('cfg'));
  db.collection('clubes').onSnapshot(s=>{S.clubs=list(s);mark('clubes');loadNames();limpiarLogos()},fail('clubes'));
  db.collection('jugadores').onSnapshot(s=>{S.players=list(s);mark('jugadores')},fail('jugadores'));
  db.collection('ofertas').onSnapshot(s=>{S.offers=list(s).sort((a,b)=>num(b.creado)-num(a.creado));mark('ofertas')},fail('ofertas'));
  db.collection('traspasos').orderBy('fecha','desc').limit(300).onSnapshot(s=>{S.transfers=list(s);mark('traspasos')},fail('traspasos'));
  db.collection('partidos').onSnapshot(s=>{S.matches=list(s);mark('partidos')},fail('partidos'));
  db.collection('logros').onSnapshot(s=>{S.logros=list(s);mark('logros')},fail('logros'));
  db.collection('actividades').onSnapshot(s=>{S.acts=list(s);mark('acts')},fail('acts'));
  db.collection('partidosEq').onSnapshot(s=>{S.peq=list(s);mark('peq')},fail('peq'));
  db.collection('ligas').onSnapshot(s=>{S.ligas=list(s);mark('ligas')},fail('ligas'));
  if(S.isAdmin)db.collection('contactos').onSnapshot(s=>{S.contacts={};s.docs.forEach(d=>S.contacts[d.id]=d.data());scheduleRender()},e=>console.error('contactos',e));
})();
</script>
